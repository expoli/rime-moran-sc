patch:
  # [app_options]
  # 针对特定应用的设置
  app_options:
    cmd.exe:
        ascii_mode: true
        ascii_punct: true
    idea64.exe:
        ascii_mode: false
        ascii_punct: true
    Code.exe:
        ascii_mode: false
        ascii_punct: true
    firefox.exe:
      inline_preedit: true # 行内显示预编辑区：规避 <https://github.com/rime/weasel/issues/946>
    # cmd.exe:               # 带 .exe 的进程名：Weasel 15.0 及之前版本须小写; PR #1049 合并后释出的版本大小写不敏感
    #   ascii_mode: true     # 英文模式
    # conhost.exe:
    #   ascii_mode: true
    # windowsterminal.exe:
    #   ascii_mode: true
    # wt.exe:
    #   ascii_mode: true
    # pwsh.exe:
    #   ascii_mode: true
    # powershell.exe:
    #   ascii_mode: true
    # mintty.exe:
    #   ascii_mode: true
    # nvim-qt.exe:
    #   ascii_mode: true
    #   vim_mode: true       # vim 模式, Esc <C-c> <C-[> 切换到 ascii 状态
  # [End of <app_options>]

  # [global settings]
  show_notifications: true                   # 是否显示状态变化的通知：true；false；option_list（方案内的开头 option）
  show_notifications_time: 1200              # 通知显示的时间，单位 ms
  global_ascii: false                        # 切换为 ascii 模式时，是否影响所有窗口：true；false
  # [End of <global settings>]
  # [style]
  # 字体；候选项、候选窗口的行为、布局及样式
  style:
    color_scheme: lost_temple                 # 默认配色方案
    color_scheme_dark: lost_temple            # 深色模式下，Weasel 的配色方案，Windows 10 1809+ 可用

    # 全局字体
    # 格式：字体1:起始码位:结束码位:字重:字形,字体2……，字体会依次 fallback
    # 详细设定请参考 <https://github.com/rime/weasel/wiki/字體設定>
    font_face: "Segoe UI Emoji, Microsoft YaHei, SF Pro, Noto Color Emoji"
    label_font_face: "Microsoft YaHei"       # 标签字体
    comment_font_face: "Microsoft YaHei"     # 注释字体
    font_point: 12                           # 全局字体字号
    label_font_point: 11                     # 标签字体字号，不设定 fallback 到 font_point
    comment_font_point: 11                   # 注释字体字号，不设定 fallback 到 font_point

    inline_preedit: true                     # 行内显示预编辑区：true；false
    preedit_type: composition                # 预编辑区内容：composition（编码）； preview（选中的候选）；preview_all（全部候选）

    fullscreen: false                        # 候选窗口全屏显示：true；false
    horizontal: true                         # 候选项横排：true；false
    vertical_text: false                     # 竖排文本：true；false
    # text_orientation: horizontal           # 文本排列方向，效果和 `vertical_text` 相同：horizontal；vertical
    vertical_text_left_to_right: false       # 竖排方向是否从左到右：true；false
    vertical_text_with_wrap: false           # 文本竖排模式下，自动换行：true；false
    vertical_auto_reverse: false             # 文本竖排模式下，候选窗口位于光标上方时倒序排列：true；false

    label_format: "%s"                       # 标签字符：例如 %s. 效果为 1. 2. 3. ....
    mark_text: ""                           # 标记字符，显示在选中的候选标签前，需要在配色方案中指定颜色；如该项为空字符串 "" 而配色方案中 hilited_mark_color 非透明色，则显示 Windows 11 输入法风格标记
    ascii_tip_follow_cursor: false           # 切换 ASCII 模式时，提示跟随鼠标，而非输入光标
    enhanced_position: true                  # 无法定位候选框时，在窗口左上角显示候选框：true；false
    display_tray_icon: false                 # 托盘显示独立于语言栏的额外图标：true；false
    antialias_mode: default                  # 次像素反锯齿设定：default；force_dword；cleartype；grayscale；aliased
    candidate_abbreviate_length: 30          # 候选项略写，超过此数字则用省略号代替。设置为 0 则不启用此功能
    # mouse_hover_ms: 0                      # ! 已弃用。鼠标悬停选词响应时间（ms），设置为 0 时禁用该功能
    hover_type: semi_hilite                  # 鼠标在候选窗口悬停时：none（无动作）；hilite（选中鼠标下的候选）；semi_hilite（高亮鼠标下的候选）

    paging_on_scroll: true                   # 在候选窗口上滑动滚轮的行为：true（翻页）；false （选中下一个候选）
    click_to_capture: false                  # 鼠标点击候选项，创建截图：true；false

  style/horizontal: true                          # true 横向 | false 竖向
  style/color_scheme: lost_temple                 # 默认配色方案
  style/color_scheme_dark: lost_temple            # 深色模式下，Weasel 的配色方案，Windows 10 1809+ 可用
  style/hover_type: none                          # 鼠标悬停候选项，显示高亮：none；hilited；hilited+comment
  style/inline_preedit: false                     # 行内显示预编辑区：true；false
  style/font_point: 12                            # 全局字体字号
  style/font_face: "霞鹜文楷等宽 GB 屏幕阅读版, 霞鹜文楷, Segoe UI Emoji:30:39, Segoe UI Emoji:23:23, Segoe UI Emoji:2a:2a, Segoe UI Emoji:fe0f:fe0f, Segoe UI Emoji:20e3:20e3, Arial:600:6ff, 思源黑体 CN, 遍黑体P1, 遍黑体P2, Segoe UI Emoji, Noto Color Emoji, Noto Color Emoji SVG"  # 全局字体
  style/label_font_face: "霞鹜文楷等宽 GB 屏幕阅读版, 霞鹜文楷, Segoe UI Emoji:30:39, Segoe UI Emoji:23:23, Segoe UI Emoji:2a:2a, Segoe UI Emoji:fe0f:fe0f, Segoe UI Emoji:20e3:20e3, Arial:600:6ff, 思源黑体 CN, 遍黑体P1, 遍黑体P2, Segoe UI Emoji, Noto Color Emoji, Noto Color Emoji SVG"      # 标签字体
  style/label_font_point: 9                      # 标签字体字号
  style/comment_font_face: "霞鹜文楷等宽 GB 屏幕阅读版, 霞鹜文楷, Segoe UI Emoji:30:39, Segoe UI Emoji:23:23, Segoe UI Emoji:2a:2a, Segoe UI Emoji:fe0f:fe0f, Segoe UI Emoji:20e3:20e3, Arial:600:6ff, 思源黑体 CN, 遍黑体P1, 遍黑体P2, Segoe UI Emoji, Noto Color Emoji, Noto Color Emoji SVG"     # 注释字体
  style/label_font_point: 10                      # 注释字体字号
  style/click_to_capture: true                    # 鼠标点击候选项，创建截图：true；false
  style/layout:
    align_type: center
    baseline: 0
    border_width: 2
    candidate_spacing: 22
    corner_radius: 8
    hilite_padding: 8
    hilite_spacing: 6
    linespacing: 0
    margin_x: 8
    margin_y: 8
    max_height: 600
    max_width: 0
    min_height: 0
    min_width: 10
    round_corner: 8
    shadow_offset_x: 4
    shadow_offset_y: 4
    shadow_radius: 5
    spacing: 13
  
  preset_color_schemes:
    lost_temple:
      name: 孤寺／Lost Temple
      author: 糖醋鱼 <me@expoli.tech>, 佛振 <chen.sst@gmail.com>, based on ir_black
      # 默认配色
      color_format: argb                       # 颜色格式：argb（0xaarrggbb）；rgba（0xrrggbbaa）；abgr（0xaabbggrr 默认）
      text_color: 0xf6f3e8                     # 文字
      shadow_color: 0x55444444                 # 阴影
      label_color: 0xffffff                    # 标签
      comment_text_color: 0xf6f3e8             # 注释
      border_color: 0x444444                   # 边框
      back_color: 0x444444                     # 背景
      # 普通候选项配色
      candidate_back_color: 0x444444           # 背景
      candidate_border_color: 0x444444         # 边框
      # candidate_shadow_color: 0x444444       # 阴影
      candidate_text_color: 0xffffff           # 文字
      # 编码区域配色
      hilited_text_color: 0xcae682             # 文字
      hilited_back_color: 0x444444             # 背景
      # hilited_shadow_color: 0xff888888         # 阴影
      # 选中的候选区域配色
      hilited_mark_color: 0x000000             # 标签前的标记
      hilited_label_color: 0x000000            # 标签
      hilited_comment_text_color: 0x000000     # 注释
      hilited_candidate_text_color: 0x000000   # 文字
      hilited_candidate_border_color: 0x444444 # 边框
      hilited_candidate_back_color: 0xcae682   # 背景
      # hilited_candidate_shadow_color: 0xff888888       # 阴影
      inline_preedit: true                     # false 时翻页箭头颜色，不设置则不显示箭头
      nextpage_color: 0xe86121                # 下一页
      prevpage_color: 0xd2ec8d                # 上一页